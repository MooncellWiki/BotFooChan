services:
  playwright:
    # 由 .github/workflows/playwright.yml 构建，版本跟随 uv.lock
    # 本地构建: ./docker/playwright/build.sh
    image: starheart/botfoochan-playwright:latest
    # run-server 没有鉴权，只在 compose 网络内暴露，不要 publish 到宿主机
    expose:
      - "3000"
    # Chromium 默认的 /dev/shm 太小，渲染长页面会崩
    ipc: host
    # run-server 听上端口后 / 才会返回 200，nonebot 靠它判断浏览器端是否可连
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 512M
    restart: always

  nonebot:
    image: starheart/botfoochan:latest
    # 只写服务名只会等容器「启动」，不等 run-server 真正可连，所以要等 healthcheck。
    # 这只管 compose up：restart: always 在宿主或 dockerd 重启时各自独立拉起、
    # 不看 depends_on。那种情况下 bison 启动时刷新 B 站 cookie 会连不上 playwright，
    # 只记日志不中断启动，cookie 由之后的重试状态机补刷；htmlrender 本就按需连接
    depends_on:
      playwright:
        condition: service_healthy
    environment:
      - ENVIRONMENT=prod
      - LOG_LEVEL=INFO
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-8086}
      - SUPERUSERS=[]
      - MAX_WORKERS=1 # maximum workers
    ports:
      - "8086:${PORT:-8086}"
    volumes:
      - ".env.prod:/app/.env.prod"
      - "./data:/app/data"
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 512M
    restart: always
