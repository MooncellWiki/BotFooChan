[project]
name = "botfoochan"
version = "1.3.2"
authors = [{ name = "StarHeartHunt", email = "starheart233@gmail.com" }]
description = "Multi channel Mooncell bot"
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.14, <4.0"
dependencies = [
  "yarl >=1.9.0, <2.0.0",
  "lxml >=5.3.0, <7.0.0",
  "pillow >=11.3.0, <13.0.0",
  "pymupdf >=1.24.0, <2.0.0",
  "rapidfuzz >=3.9.7, <4.0.0",
  "feedparser >=6.0.11, <7.0.0",
  "matplotlib >=3.8.0, <4.0.0",
  "playwright >=1.38.0, <2.0.0",
  "beautifulsoup4 >=4.12.3, <5.0.0",
  "pydantic-ai-slim[openai,anthropic] >=2.0.0, <3.0.0",
  "nonebot-adapter-qq >=1.1.0, <2.0.0",
  "nonebot-plugin-orm[sqlite] >=0.7.0, <1.0.0",
  "nonebot-plugin-sentry >=2.0.0, <3.0.0",
  "nonebot-plugin-waiter >=0.8.0, <1.0.0",
  "nonebot-adapter-feishu >=2.3.0, <3.0.0",
  "nonebot-adapter-onebot >=2.3.0, <3.0.0",
  "nonebot-plugin-alconna >=0.38.0, <1.0.0",
  "nonebot-plugin-filehost >=1.1.0, <2.0.0",
  "nonebot-plugin-shorturl >=0.4.0, <1.0.0",
  "nonebot-plugin-treehelp >=0.3.0, <1.0.0",
  "nonebot-plugin-htmlrender[playwright] >=0.8.1, <0.9.0",
  "nonebot-plugin-localstore >=0.7.0, <1.0.0",
  "nonebot-plugin-apscheduler >=0.4.0, <1.0.0",
  "nonebot2[httpx,fastapi,websockets] >=2.1.0, <3.0.0",
  "markdown-it-py >=4.2.0, <5.0.0",
  "mdit-py-plugins >=0.6.1, <1.0.0",
  "pygments >=2.20.0, <3.0.0",
  "jinja2 >=3.1.6, <4.0.0",
]

[dependency-groups]
dev = [
  "ruff >=0.9.0, <1.0.0",
  "nb-cli >=1.7.4, <2.0.0",
  "pre-commit >=4.1.0, <5.0.0",
]
deploy = ["gunicorn >=26.0.0, <27.0.0", "uvicorn >=0.18.0, <1.0.0"]

# 仅供 nb-cli 使用（`nb orm ...`）：它自己拼启动脚本，只认 [tool.nonebot]，不走 bot.py。
# 运行时的插件列表以 .env 的 PLUGINS / PLUGIN_DIRS 为准，改那边时记得同步这里，
# 否则 `nb orm revision` 会看不到新插件的模型。
[tool.nonebot]
adapters = [
  { name = "QQ", module_name = "nonebot.adapters.qq" },
  { name = "Feishu", module_name = "nonebot.adapters.feishu" },
  { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" },
]
plugins = [
  "nonebot_plugin_sentry",
  "nonebot_plugin_alconna",
  "nonebot_plugin_apscheduler",
  "nonebot_plugin_filehost",
  "nonebot_plugin_shorturl",
  "nonebot_plugin_treehelp",
]
plugin_dirs = ["src/plugins", "src/providers"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = [
  "F",     # pyflakes
  "W",     # pycodestyle warnings
  "E",     # pycodestyle errors
  "I",     # isort
  "UP",    # pyupgrade
  "ASYNC", # flake8-async
  "C4",    # flake8-comprehensions
  "DTZ",   # flake8-datetimez
  "T10",   # flake8-debugger
  "T20",   # flake8-print
  "PYI",   # flake8-pyi
  "PT",    # flake8-pytest-style
  "Q",     # flake8-quotes
  "TC",    # flake8-type-checking
  "TID",   # flake8-tidy-imports
  "RUF",   # Ruff-specific rules
]
ignore = [
  "E402",   # module-import-not-at-top-of-file
  "UP037",  # quoted-annotation
  "RUF001", # ambiguous-unicode-character-string
  "RUF002", # ambiguous-unicode-character-docstring
  "RUF003", # ambiguous-unicode-character-comment
  "TC001",  # typing-only-first-party-import
  "TC002",  # typing-only-third-party-import
  "TC003",  # typing-only-standard-library-import
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
# src/providers/playwright 与三方包同名，避免其中的 playwright 导入被判为同包
known-third-party = ["playwright"]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.pyright]
pythonPlatform = "All"

typeCheckingMode = "standard"
disableBytesTypePromotions = true
