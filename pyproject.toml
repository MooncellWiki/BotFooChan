[project]
name = "botfoochan"
version = "1.0.2"
authors = [{ name = "StarHeartHunt", email = "starheart233@gmail.com" }]
description = "Multi channel Mooncell bot"
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.14, <4.0"
dependencies = [
  "yarl >=1.9.0, <2.0.0",
  "pillow >=11.3.0, <12.0.0",
  "pymupdf >=1.24.0, <2.0.0",
  "matplotlib >=3.8.0, <4.0.0",
  "playwright >=1.38.0, <2.0.0",
  "pydantic-ai-slim[openai] >=2.0.0, <3.0.0",
  "nonebot-bison >=0.9.0, <1.0.0",
  "nonebot-adapter-qq >=1.1.0, <2.0.0",
  "nonebot-plugin-sentry >=2.0.0, <3.0.0",
  "nonebot-plugin-waiter >=0.8.0, <1.0.0",
  "nonebot-adapter-feishu >=2.3.0, <3.0.0",
  "nonebot-adapter-onebot >=2.3.0, <3.0.0",
  "nonebot-plugin-alconna >=0.38.0, <1.0.0",
  "nonebot-plugin-filehost >=1.1.0, <2.0.0",
  "nonebot-plugin-shorturl >=0.4.0, <1.0.0",
  "nonebot-plugin-treehelp >=0.3.0, <1.0.0",
  "nonebot-plugin-htmlrender >=0.7.0, <0.8.0",
  "nonebot-plugin-localstore >=0.7.0, <1.0.0",
  "nonebot-plugin-apscheduler >=0.4.0, <1.0.0",
  "nonebot2[httpx,fastapi,websockets] >=2.1.0, <3.0.0",
]

[dependency-groups]
dev = ["ruff >=0.9.0, <1.0.0", "pre-commit >=4.1.0, <5.0.0"]
deploy = ["gunicorn >=23.0.0, <24.0.0", "uvicorn >=0.18.0, <1.0.0"]

[tool.uv]
# nonebot-bison pins pillow <11.1, but pillow gained cp314 wheels in 11.3.0
override-dependencies = ["pillow >=11.3.0, <12.0.0"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = [
  "F",     # pyflakes
  "W",     # pycodestyle warnings
  "E",     # pycodestyle errors
  "I",     # isort
  "UP",    # pyupgrade
  "ASYNC", # flake8-async
  "C4",    # flake8-comprehensions
  "DTZ",   # flake8-datetimez
  "T10",   # flake8-debugger
  "T20",   # flake8-print
  "PYI",   # flake8-pyi
  "PT",    # flake8-pytest-style
  "Q",     # flake8-quotes
  "TC",    # flake8-type-checking
  "TID",   # flake8-tidy-imports
  "RUF",   # Ruff-specific rules
]
ignore = [
  "E402",   # module-import-not-at-top-of-file
  "UP037",  # quoted-annotation
  "RUF001", # ambiguous-unicode-character-string
  "RUF002", # ambiguous-unicode-character-docstring
  "RUF003", # ambiguous-unicode-character-comment
  "TC001",  # typing-only-first-party-import
  "TC002",  # typing-only-third-party-import
  "TC003",  # typing-only-standard-library-import
]

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.pyright]
pythonPlatform = "All"

typeCheckingMode = "standard"
reportShadowedImports = false
disableBytesTypePromotions = true
